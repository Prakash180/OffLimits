<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 88" width="300" height="88" role="img" aria-label="PyJWT Codex">
  <defs>
    <linearGradient id="lgMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .word { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: .5px; }
      .word2 { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: .5px; }
      .sub { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; font-size: 11px; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- mark: rounded tile with braces + padlock/keyhole -->
  <g transform="translate(12,12)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#0f172a" stroke="url(#lgMark)" stroke-width="3"/>
    <!-- left brace -->
    <path d="M20 16 q-8 0 -8 8 q0 6 -6 8 q6 2 6 8 q0 8 8 8"
          fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- right brace -->
    <path d="M44 16 q8 0 8 8 q0 6 6 8 q-6 2 -6 8 q0 8 -8 8"
          fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- keyhole / padlock in center -->
    <path d="M26 30 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="38" r="6" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <line x1="32" y1="42" x2="32" y2="50" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text class="word" x="92" y="46" fill="#e2e8f0">PyJWT</text>
  <text class="word2" x="186" y="46" fill="url(#lgMark)">Codex</text>
  <text class="sub" x="93" y="68" fill="#64748b">JWT · CRYPTO · PYTHON</text>
</svg>
