<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-label="Key rotation with JWKS: token kid selects matching key">
  <defs>
    <style>
      .ttl { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 18px; }
      .lbl { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
      .flow { stroke-dasharray: 7 7; animation: march 1.3s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -28; } }
      .sel { animation: glow 2.2s ease-in-out infinite; }
      @keyframes glow { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow,.sel { animation: none; } }
    </style>
  </defs>

  <!-- Token -->
  <text class="ttl" x="150" y="50" text-anchor="middle" fill="#e2e8f0">Incoming JWT</text>
  <rect x="40" y="76" width="220" height="120" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <text class="lbl" x="64" y="112" fill="#94a3b8">header</text>
  <rect x="64" y="124" width="172" height="34" rx="8" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="2"/>
  <text class="mono" x="150" y="146" text-anchor="middle" fill="#c4b5fd">"kid": "B"</text>
  <text class="mono" x="150" y="182" text-anchor="middle" fill="#64748b">alg: RS256</text>

  <!-- selecting arrow -->
  <line class="flow" x1="264" y1="136" x2="392" y2="136" stroke="#fbbf24" stroke-width="3" marker-end="url(#a2)"/>
  <text class="lbl" x="328" y="124" text-anchor="middle" fill="#fbbf24">match kid</text>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- JWKS -->
  <text class="ttl" x="600" y="50" text-anchor="middle" fill="#e2e8f0">JWKS endpoint</text>
  <rect x="408" y="64" width="384" height="232" rx="20" fill="#a78bfa" fill-opacity="0.05" stroke="#334155" stroke-width="2"/>
  <text class="mono" x="430" y="92" fill="#64748b">{ "keys": [ … ] }</text>

  <!-- key A (not selected) -->
  <g>
    <rect x="432" y="108" width="336" height="74" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="472" cy="145" r="16" fill="none" stroke="#64748b" stroke-width="3"/>
    <line x1="486" y1="145" x2="516" y2="145" stroke="#64748b" stroke-width="3"/>
    <text class="mono" x="540" y="140" fill="#94a3b8">kid: "A"</text>
    <text class="mono" x="540" y="162" fill="#475569">retired key</text>
  </g>

  <!-- key B (selected) -->
  <g>
    <rect class="sel" x="432" y="196" width="336" height="74" rx="14" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-width="3"/>
    <circle cx="472" cy="233" r="16" fill="none" stroke="#34d399" stroke-width="3"/>
    <line x1="486" y1="233" x2="516" y2="233" stroke="#34d399" stroke-width="3"/>
    <text class="mono" x="540" y="228" fill="#6ee7b7">kid: "B"</text>
    <text class="mono" x="540" y="250" fill="#34d399">active → verifies ✓</text>
  </g>

  <text class="lbl" x="410" y="332" text-anchor="middle" fill="#64748b">Rotate keys without breaking live tokens — the kid points to the right one.</text>
</svg>
