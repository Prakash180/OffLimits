<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="Sign and verify flow: private key signs a token, public key verifies it">
  <defs>
    <style>
      .ttl { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; }
      .sub { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 12px; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
      .flow { stroke-dasharray: 8 8; animation: march 1.2s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -32; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .pulse { animation: none; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- private key / sign -->
  <g class="pulse">
    <rect x="24" y="74" width="176" height="112" rx="18" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-width="2.5"/>
    <rect x="92" y="118" width="40" height="34" rx="6" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <path d="M99 118 v-10 a13 13 0 0 1 26 0 v10" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="112" cy="134" r="4" fill="#a78bfa"/>
  </g>
  <text class="ttl" x="112" y="58" text-anchor="middle" fill="#a78bfa">Private Key</text>
  <text class="sub" x="112" y="208" text-anchor="middle" fill="#c4b5fd">signs the token</text>

  <line class="flow" x1="204" y1="130" x2="316" y2="130" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="sub" x="260" y="118" text-anchor="middle" fill="#64748b">sign</text>

  <!-- token -->
  <g>
    <rect x="320" y="86" width="180" height="88" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
    <rect x="334" y="112" width="44" height="36" rx="7" fill="#22d3ee" fill-opacity="0.22" stroke="#22d3ee" stroke-width="2"/>
    <rect x="388" y="112" width="44" height="36" rx="7" fill="#a78bfa" fill-opacity="0.22" stroke="#a78bfa" stroke-width="2"/>
    <rect x="442" y="112" width="44" height="36" rx="7" fill="#34d399" fill-opacity="0.22" stroke="#34d399" stroke-width="2"/>
    <text class="ttl" x="410" y="74" text-anchor="middle" fill="#e2e8f0">JWT</text>
    <text class="mono" x="410" y="166" text-anchor="middle" fill="#94a3b8">h . p . s</text>
  </g>

  <line class="flow" x1="504" y1="130" x2="616" y2="130" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="sub" x="560" y="118" text-anchor="middle" fill="#64748b">verify</text>

  <!-- public key / verify -->
  <g class="pulse">
    <rect x="620" y="74" width="176" height="112" rx="18" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="708" cy="130" r="30" fill="none" stroke="#34d399" stroke-width="3"/>
    <path d="M694 130 l10 12 l20 -24" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="ttl" x="708" y="58" text-anchor="middle" fill="#34d399">Public Key</text>
  <text class="sub" x="708" y="208" text-anchor="middle" fill="#6ee7b7">confirms authenticity</text>
</svg>
