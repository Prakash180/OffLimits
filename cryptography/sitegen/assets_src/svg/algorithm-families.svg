<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-label="JWT algorithm families">
  <defs>
    <style>
      .h { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 15px; }
      .desc { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 13px; }
      .tag { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    </style>
  </defs>

  <text class="h" x="420" y="44" text-anchor="middle" fill="#e2e8f0">JWT Algorithm Families</text>

  <!-- HMAC -->
  <g>
    <rect x="32" y="76" width="372" height="116" rx="18" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-width="2.5"/>
    <text class="code" x="56" y="116" fill="#22d3ee">HS256 · HS384 · HS512</text>
    <text class="desc" x="56" y="142" fill="#e2e8f0" font-weight="700">HMAC — shared secret</text>
    <text class="desc" x="56" y="164" fill="#94a3b8">Fast &amp; simple; both sides hold the same key.</text>
    <text class="tag" x="380" y="100" text-anchor="end" fill="#7dd3fc">symmetric</text>
  </g>

  <!-- RSA -->
  <g>
    <rect x="436" y="76" width="372" height="116" rx="18" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="2.5"/>
    <text class="code" x="460" y="116" fill="#a78bfa">RS256/384/512 · PS256/384/512</text>
    <text class="desc" x="460" y="142" fill="#e2e8f0" font-weight="700">RSA — public / private</text>
    <text class="desc" x="460" y="164" fill="#94a3b8">Widely supported; PS uses RSA-PSS padding.</text>
    <text class="tag" x="784" y="100" text-anchor="end" fill="#c4b5fd">asymmetric</text>
  </g>

  <!-- ECDSA -->
  <g>
    <rect x="32" y="212" width="372" height="116" rx="18" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="2.5"/>
    <text class="code" x="56" y="252" fill="#34d399">ES256 · ES384 · ES512 · ES256K</text>
    <text class="desc" x="56" y="278" fill="#e2e8f0" font-weight="700">ECDSA — elliptic curve</text>
    <text class="desc" x="56" y="300" fill="#94a3b8">Small keys &amp; signatures; curve must match alg.</text>
    <text class="tag" x="380" y="236" text-anchor="end" fill="#6ee7b7">asymmetric</text>
  </g>

  <!-- EdDSA -->
  <g>
    <rect x="436" y="212" width="372" height="116" rx="18" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="2.5"/>
    <text class="code" x="460" y="252" fill="#fbbf24">EdDSA (Ed25519 · Ed448)</text>
    <text class="desc" x="460" y="278" fill="#e2e8f0" font-weight="700">EdDSA — modern curves</text>
    <text class="desc" x="460" y="300" fill="#94a3b8">Deterministic, fast, strong defaults.</text>
    <text class="tag" x="784" y="236" text-anchor="end" fill="#fde68a">asymmetric</text>
  </g>
</svg>
